<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">移动端自动化多层架构</title>
  <desc id="desc">从协作编排、业务场景、统一语义操作到 Poco UIAutomator、OCR、CV 多模态识别与大模型视觉兜底，再由 Airtest 原生执行并在真实设备上留存证据的分层架构。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset="0.55" stop-color="#0c1220"/>
      <stop offset="1" stop-color="#10172a"/>
    </linearGradient>
    <linearGradient id="cyanFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173441"/>
      <stop offset="1" stop-color="#102330"/>
    </linearGradient>
    <linearGradient id="blueFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2544"/>
      <stop offset="1" stop-color="#121a31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6ee7f2"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .title { fill: #f3f6fb; font-size: 42px; font-weight: 650; letter-spacing: -1px; }
      .subtitle { fill: #91a0b5; font-size: 17px; }
      .layer-num { fill: #6ee7f2; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .layer-title { fill: #f3f6fb; font-size: 22px; font-weight: 650; }
      .layer-note { fill: #91a0b5; font-size: 13px; }
      .node-title { fill: #edf4ff; font-size: 16px; font-weight: 650; }
      .node-note { fill: #91a0b5; font-size: 12px; }
      .chip { fill: #cbd6e6; font-size: 12px; }
      .rail-title { fill: #ffc66d; font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
      .rail-item { fill: #f3f6fb; font-size: 15px; font-weight: 620; }
      .rail-note { fill: #91a0b5; font-size: 12px; }
    </style>
  </defs>

  <rect width="1600" height="1050" rx="30" fill="url(#bg)"/>
  <g opacity="0.22" stroke="#8aa0c7" stroke-width="1">
    <path d="M0 84H1600M0 966H1600"/>
    <path d="M72 0V1050M1266 0V1050M1530 0V1050"/>
  </g>

  <g class="sans">
    <text class="title" x="72" y="72">移动端自动化多层架构</text>
    <text class="subtitle" x="72" y="108">业务意图与识别技术解耦 · 多模态感知增强 · 原生 Airtest 稳定执行 · 全程证据闭环</text>
    <g transform="translate(1218 54)">
      <rect width="310" height="42" rx="21" fill="#0f2130" stroke="#6ee7f2" stroke-opacity="0.38"/>
      <circle cx="22" cy="21" r="5" fill="#6ee7f2"/>
      <text class="mono" x="38" y="26" fill="#bff8fc" font-size="12">AIRTEST · OCR · CV · VLM · POCO</text>
    </g>

    <!-- Layer 01 -->
    <g filter="url(#shadow)">
      <rect x="72" y="150" width="1170" height="112" rx="18" fill="#0e1522" stroke="#7f93b5" stroke-opacity="0.22"/>
    </g>
    <text class="layer-num mono" x="94" y="181">LAYER 01</text>
    <text class="layer-title" x="94" y="210">触发与编排</text>
    <text class="layer-note" x="94" y="235">任务进入、资源协调与安全时序</text>
    <g transform="translate(328 172)">
      <rect width="172" height="66" rx="13" fill="#141d2d" stroke="#8496b5" stroke-opacity="0.28"/>
      <text class="node-title" x="86" y="27" text-anchor="middle">协作入口</text>
      <text class="node-note" x="86" y="48" text-anchor="middle">飞书 · CI · Webhook · Agent</text>
    </g>
    <path d="M510 205H565" stroke="#6ee7f2" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(578 166)">
      <rect width="212" height="78" rx="15" fill="url(#cyanFill)" stroke="#6ee7f2" stroke-opacity="0.56"/>
      <text class="node-title" x="106" y="31" text-anchor="middle">QA Manager</text>
      <text class="node-note" x="106" y="54" text-anchor="middle">校验 · 编排 · 状态机 · 恢复</text>
    </g>
    <path d="M800 205H855" stroke="#6ee7f2" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(868 172)">
      <rect width="330" height="66" rx="13" fill="#141d2d" stroke="#8496b5" stroke-opacity="0.28"/>
      <text class="node-title" x="165" y="27" text-anchor="middle">资源服务</text>
      <text class="node-note" x="165" y="48" text-anchor="middle">安装包 · 账号前置 · 设备租约 · 健康检查</text>
    </g>

    <!-- Layer 02 -->
    <g filter="url(#shadow)">
      <rect x="72" y="280" width="1170" height="128" rx="18" fill="#0e1522" stroke="#7f93b5" stroke-opacity="0.22"/>
    </g>
    <text class="layer-num mono" x="94" y="311">LAYER 02</text>
    <text class="layer-title" x="94" y="340">业务场景</text>
    <text class="layer-note" x="94" y="365">跨项目复用，保留领域语义</text>
    <g transform="translate(328 305)">
      <rect width="200" height="78" rx="14" fill="#141d2d" stroke="#8496b5" stroke-opacity="0.28"/>
      <text class="node-title" x="100" y="30" text-anchor="middle">多项目 Runner</text>
      <text class="node-note" x="100" y="54" text-anchor="middle">应用 · 游戏 · H5 活动</text>
    </g>
    <g transform="translate(544 305)">
      <rect width="292" height="78" rx="14" fill="#141d2d" stroke="#8496b5" stroke-opacity="0.28"/>
      <text class="node-title" x="146" y="30" text-anchor="middle">Page · Surface · Service · Case</text>
      <text class="node-note" x="146" y="54" text-anchor="middle">页面分类 · 业务闭环 · 场景断言</text>
    </g>
    <g transform="translate(852 305)">
      <rect width="160" height="78" rx="14" fill="#141d2d" stroke="#8496b5" stroke-opacity="0.28"/>
      <text class="node-title" x="80" y="30" text-anchor="middle">多设备互动</text>
      <text class="node-note" x="80" y="54" text-anchor="middle">并行 · 协同 · 隔离</text>
    </g>
    <g transform="translate(1028 305)">
      <rect width="170" height="78" rx="14" fill="#141d2d" stroke="#8496b5" stroke-opacity="0.28"/>
      <text class="node-title" x="85" y="30" text-anchor="middle">perfX 性能专项</text>
      <text class="node-note" x="85" y="54" text-anchor="middle">采集 · 对比 · 归因</text>
    </g>

    <!-- Layer 03 -->
    <g filter="url(#shadow)">
      <rect x="72" y="426" width="1170" height="252" rx="18" fill="#0d1524" stroke="#6ee7f2" stroke-opacity="0.30"/>
    </g>
    <text class="layer-num mono" x="94" y="459">LAYER 03</text>
    <text class="layer-title" x="94" y="488">语义与感知</text>
    <text class="layer-note" x="94" y="513">同一业务动作，按场景选择识别能力</text>
    <g transform="translate(328 448)">
      <rect width="870" height="46" rx="12" fill="#102330" stroke="#6ee7f2" stroke-opacity="0.35"/>
      <text class="mono" x="435" y="29" text-anchor="middle" fill="#bff8fc" font-size="13">UNIFIED SEMANTIC API  ·  find  ·  click  ·  exists  ·  input  ·  assert</text>
    </g>
    <text class="node-note" x="328" y="523">AUTO SELECTOR 能力路由：结构化 UI 优先，OCR / CV 增强，大模型视觉低置信兜底</text>
    <g transform="translate(328 542)">
      <rect width="204" height="108" rx="15" fill="#141d2d" stroke="#91a7cc" stroke-opacity="0.34"/>
      <rect x="14" y="14" width="86" height="22" rx="11" fill="#1a273d"/>
      <text class="mono" x="57" y="29" text-anchor="middle" fill="#aebbd0" font-size="10">STRUCTURED</text>
      <text class="node-title" x="18" y="62">Poco / UIAutomator2</text>
      <text class="node-note" x="18" y="86">resource-id · text · UI Tree</text>
    </g>
    <g transform="translate(544 542)">
      <rect width="190" height="108" rx="15" fill="url(#blueFill)" stroke="#728cff" stroke-opacity="0.60"/>
      <rect x="14" y="14" width="50" height="22" rx="11" fill="#202e5a"/>
      <text class="mono" x="39" y="29" text-anchor="middle" fill="#c6d0ff" font-size="10">OCR</text>
      <text class="node-title" x="18" y="62">Zeus OCR</text>
      <text class="node-note" x="18" y="86">多语言 · 文本定位 · 坐标</text>
    </g>
    <g transform="translate(746 542)">
      <rect width="206" height="108" rx="15" fill="url(#cyanFill)" stroke="#6ee7f2" stroke-opacity="0.56"/>
      <rect x="14" y="14" width="42" height="22" rx="11" fill="#183945"/>
      <text class="mono" x="35" y="29" text-anchor="middle" fill="#bff8fc" font-size="10">CV</text>
      <text class="node-title" x="18" y="62">AirCV · SIFT</text>
      <text class="node-note" x="18" y="86">图标 · Canvas · 视觉特征</text>
    </g>
    <g transform="translate(964 542)">
      <rect width="234" height="108" rx="15" fill="url(#blueFill)" stroke="#9a8cff" stroke-opacity="0.70"/>
      <rect x="14" y="14" width="42" height="22" rx="11" fill="#30275a"/>
      <text class="mono" x="35" y="29" text-anchor="middle" fill="#ded8ff" font-size="10">VLM</text>
      <text class="node-title" x="18" y="62">Vision LLM Fallback</text>
      <text class="node-note" x="18" y="86">低置信 · 复杂画面 · 语义兜底</text>
    </g>

    <!-- Layer 04 -->
    <g filter="url(#shadow)">
      <rect x="72" y="696" width="1170" height="122" rx="18" fill="#0e1522" stroke="#7f93b5" stroke-opacity="0.22"/>
    </g>
    <text class="layer-num mono" x="94" y="729">LAYER 04</text>
    <text class="layer-title" x="94" y="758">原生执行</text>
    <text class="layer-note" x="94" y="783">识别结果统一转换为设备动作</text>
    <g transform="translate(328 716)">
      <rect width="540" height="82" rx="16" fill="url(#cyanFill)" stroke="#6ee7f2" stroke-opacity="0.70"/>
      <text class="node-title" x="270" y="31" text-anchor="middle">Airtest Core</text>
      <text class="node-note" x="270" y="57" text-anchor="middle">touch · swipe · text · keyevent · app lifecycle · screenshot</text>
    </g>
    <path d="M878 757H925" stroke="#6ee7f2" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(938 716)">
      <rect width="260" height="82" rx="16" fill="#141d2d" stroke="#8496b5" stroke-opacity="0.34"/>
      <text class="node-title" x="130" y="31" text-anchor="middle">设备传输与控制</text>
      <text class="node-note" x="130" y="57" text-anchor="middle">ADB · Remote Device Control</text>
    </g>

    <!-- Layer 05 -->
    <g filter="url(#shadow)">
      <rect x="72" y="836" width="1170" height="114" rx="18" fill="#0e1522" stroke="#7f93b5" stroke-opacity="0.22"/>
    </g>
    <text class="layer-num mono" x="94" y="869">LAYER 05</text>
    <text class="layer-title" x="94" y="898">真实环境</text>
    <text class="layer-note" x="94" y="923">本地与远程设备，统一运行边界</text>
    <g transform="translate(328 856)">
      <rect width="265" height="74" rx="15" fill="#141d2d" stroke="#8496b5" stroke-opacity="0.28"/>
      <text class="node-title" x="132.5" y="29" text-anchor="middle">Android 真机池</text>
      <text class="node-note" x="132.5" y="52" text-anchor="middle">本地 · 远程 · 独占租约</text>
    </g>
    <g transform="translate(608 856)">
      <rect width="265" height="74" rx="15" fill="#141d2d" stroke="#8496b5" stroke-opacity="0.28"/>
      <text class="node-title" x="132.5" y="29" text-anchor="middle">多技术界面</text>
      <text class="node-note" x="132.5" y="52" text-anchor="middle">Native · WebView · Unity · 游戏</text>
    </g>
    <g transform="translate(888 856)">
      <rect width="310" height="74" rx="15" fill="#141d2d" stroke="#8496b5" stroke-opacity="0.28"/>
      <text class="node-title" x="155" y="29" text-anchor="middle">多状态稳定帧</text>
      <text class="node-note" x="155" y="52" text-anchor="middle">等待就绪 · 动作后确认 · 异常现场</text>
    </g>

    <!-- Vertical flow arrows -->
    <path d="M758 262V278" stroke="#6ee7f2" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M758 408V424" stroke="#6ee7f2" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M758 678V694" stroke="#6ee7f2" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M758 818V834" stroke="#6ee7f2" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Evidence rail -->
    <g filter="url(#shadow)">
      <rect x="1270" y="150" width="258" height="800" rx="20" fill="#121724" stroke="#ffc66d" stroke-opacity="0.36"/>
    </g>
    <text class="rail-title mono" x="1300" y="188">EVIDENCE RAIL</text>
    <text class="layer-title" x="1300" y="220">证据与反馈闭环</text>
    <path d="M1312 256V854" stroke="#ffc66d" stroke-opacity="0.42" stroke-width="2" stroke-dasharray="5 8"/>
    <g transform="translate(0 0)">
      <circle cx="1312" cy="292" r="7" fill="#ffc66d"/>
      <text class="rail-item" x="1338" y="288">运行边界</text>
      <text class="rail-note" x="1338" y="311">租约 · 心跳 · 账号前置</text>
    </g>
    <g transform="translate(0 136)">
      <circle cx="1312" cy="292" r="7" fill="#6ee7f2"/>
      <text class="rail-item" x="1338" y="288">现场证据</text>
      <text class="rail-note" x="1338" y="311">截图 · 录屏 · 动作轨迹</text>
    </g>
    <g transform="translate(0 272)">
      <circle cx="1312" cy="292" r="7" fill="#728cff"/>
      <text class="rail-item" x="1338" y="288">结果判断</text>
      <text class="rail-note" x="1338" y="311">断言 · 通过 · 失败 · 阻断</text>
    </g>
    <g transform="translate(0 408)">
      <circle cx="1312" cy="292" r="7" fill="#6ee7f2"/>
      <text class="rail-item" x="1338" y="288">协作回写</text>
      <text class="rail-note" x="1338" y="311">状态 · 报告 · 附件索引</text>
    </g>
    <g transform="translate(0 544)">
      <circle cx="1312" cy="292" r="7" fill="#ffc66d"/>
      <text class="rail-item" x="1338" y="288">持续反哺</text>
      <text class="rail-note" x="1338" y="311">规则 · Selector · Case 资产</text>
    </g>
    <path d="M1312 880C1262 880 1257 550 1224 550" fill="none" stroke="#ffc66d" stroke-opacity="0.52" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="mono" x="1399" y="910" text-anchor="middle" fill="#ffc66d" font-size="10">FAILURE EVIDENCE → LEARNING</text>

    <text class="mono" x="72" y="1010" fill="#6f7f98" font-size="11">PUBLIC ARCHITECTURE · SENSITIVE ENDPOINTS, ACCOUNTS AND DEVICE IDENTIFIERS REMOVED</text>
    <text class="mono" x="1528" y="1010" text-anchor="end" fill="#6f7f98" font-size="11">ZHANG CHEN / AUTOMATION ENGINEERING</text>
  </g>
</svg>
