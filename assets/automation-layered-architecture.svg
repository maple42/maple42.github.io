<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">移动端自动化多层架构</title>
  <desc id="desc">从协作编排、业务场景、统一语义操作到 Poco、UIAutomator2、OCR、CV 多模态识别与大模型视觉兜底，再由 Airtest 原生执行并在真实设备上留存证据的分层架构。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#1f5b4c"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .title { fill: #1b1b19; font-size: 42px; font-weight: 700; letter-spacing: -1px; }
      .subtitle { fill: #66655f; font-size: 17px; }
      .layer-num { fill: #1f5b4c; font-size: 12px; font-weight: 700; }
      .layer-title { fill: #1b1b19; font-size: 22px; font-weight: 700; }
      .layer-note { fill: #66655f; font-size: 13px; }
      .node-title { fill: #1b1b19; font-size: 16px; font-weight: 650; }
      .node-note { fill: #66655f; font-size: 12px; }
      .tech { fill: #1f5b4c; font-size: 11px; font-weight: 700; }
      .warm { fill: #9a4b2f; }
      .rail-title { fill: #9a4b2f; font-size: 13px; font-weight: 700; }
      .rail-item { fill: #1b1b19; font-size: 15px; font-weight: 650; }
      .rail-note { fill: #66655f; font-size: 12px; }
      /* Shared site palette: calm editorial blue, without gradients or glow. */
      [fill="#f3f1eb"] { fill: #edf5ff; }
      [fill="#fbfaf7"] { fill: #ffffff; }
      [fill="#1b1b19"] { fill: #17243a; }
      [fill="#66655f"] { fill: #5a687b; }
      [fill="#1f5b4c"] { fill: #1d5fc4; }
      [fill="#9a4b2f"] { fill: #356da8; }
      [fill="#e8efeb"] { fill: #dcecff; }
      [fill="#edf2ee"] { fill: #e8f1ff; }
      [fill="#eeeae0"] { fill: #e5edf7; }
      [fill="#f4e9e4"] { fill: #e8f1ff; }
      [stroke="#1b1b19"] { stroke: #17243a; }
      [stroke="#66655f"] { stroke: #5a687b; }
      [stroke="#1f5b4c"] { stroke: #1d5fc4; }
      [stroke="#9a4b2f"] { stroke: #356da8; }
      .title, .layer-title, .node-title, .rail-item { fill: #17243a; }
      .subtitle, .layer-note, .node-note, .rail-note { fill: #5a687b; }
      .layer-num, .tech { fill: #1d5fc4; }
      .warm, .rail-title { fill: #356da8; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#f3f1eb"/>
  <g class="sans">
    <text class="title" x="72" y="72">移动端自动化多层架构</text>
    <text class="subtitle" x="72" y="108">业务意图与识别技术解耦 · 多模态感知增强 · Airtest 原生执行 · 全程记录与回传</text>
    <g transform="translate(1218 50)">
      <rect width="310" height="46" rx="2" fill="#fbfaf7" stroke="#1b1b19" stroke-opacity="0.42"/>
      <rect width="7" height="46" fill="#1f5b4c"/>
      <text class="mono" x="24" y="29" fill="#1b1b19" font-size="12">Airtest · OCR · CV · VLM · Poco</text>
    </g>
    <path d="M72 130H1528" stroke="#1b1b19" stroke-opacity="0.42"/>

    <!-- 第 1 层：触发与编排 -->
    <rect x="72" y="150" width="1170" height="112" fill="#fbfaf7" stroke="#1b1b19" stroke-opacity="0.18"/>
    <path d="M302 150V262" stroke="#1b1b19" stroke-opacity="0.18"/>
    <text class="layer-num" x="94" y="181">第 1 层</text>
    <text class="layer-title" x="94" y="210">触发与编排</text>
    <text class="layer-note" x="94" y="235">任务进入、资源协调与安全时序</text>
    <g transform="translate(328 172)">
      <rect width="172" height="66" rx="2" fill="#f3f1eb" stroke="#1b1b19" stroke-opacity="0.26"/>
      <text class="node-title" x="86" y="27" text-anchor="middle">协作入口</text>
      <text class="node-note" x="86" y="48" text-anchor="middle">飞书 · CI · Webhook · Agent</text>
    </g>
    <path d="M510 205H565" stroke="#1f5b4c" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(578 166)">
      <rect width="212" height="78" rx="2" fill="#e8efeb" stroke="#1f5b4c" stroke-opacity="0.68"/>
      <text class="node-title" x="106" y="31" text-anchor="middle">QA Manager</text>
      <text class="node-note" x="106" y="54" text-anchor="middle">校验 · 编排 · 状态机 · 恢复</text>
    </g>
    <path d="M800 205H855" stroke="#1f5b4c" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(868 172)">
      <rect width="330" height="66" rx="2" fill="#f3f1eb" stroke="#1b1b19" stroke-opacity="0.26"/>
      <text class="node-title" x="165" y="27" text-anchor="middle">资源服务</text>
      <text class="node-note" x="165" y="48" text-anchor="middle">安装包 · 账号前置 · 设备租约 · 健康检查</text>
    </g>

    <!-- 第 2 层：业务场景 -->
    <rect x="72" y="280" width="1170" height="128" fill="#fbfaf7" stroke="#1b1b19" stroke-opacity="0.18"/>
    <path d="M302 280V408" stroke="#1b1b19" stroke-opacity="0.18"/>
    <text class="layer-num" x="94" y="311">第 2 层</text>
    <text class="layer-title" x="94" y="340">业务场景</text>
    <text class="layer-note" x="94" y="365">跨项目复用，保留领域语义</text>
    <g transform="translate(328 305)">
      <rect width="200" height="78" rx="2" fill="#f3f1eb" stroke="#1b1b19" stroke-opacity="0.26"/>
      <text class="node-title" x="100" y="30" text-anchor="middle">多项目 Runner</text>
      <text class="node-note" x="100" y="54" text-anchor="middle">应用 · 游戏 · H5 活动</text>
    </g>
    <g transform="translate(544 305)">
      <rect width="292" height="78" rx="2" fill="#f3f1eb" stroke="#1b1b19" stroke-opacity="0.26"/>
      <text class="node-title" x="146" y="30" text-anchor="middle">Page · Surface · Service · Case</text>
      <text class="node-note" x="146" y="54" text-anchor="middle">页面分类 · 业务流程 · 场景断言</text>
    </g>
    <g transform="translate(852 305)">
      <rect width="160" height="78" rx="2" fill="#f3f1eb" stroke="#1b1b19" stroke-opacity="0.26"/>
      <text class="node-title" x="80" y="30" text-anchor="middle">多设备互动</text>
      <text class="node-note" x="80" y="54" text-anchor="middle">并行 · 协同 · 隔离</text>
    </g>
    <g transform="translate(1028 305)">
      <rect width="170" height="78" rx="2" fill="#f3f1eb" stroke="#1b1b19" stroke-opacity="0.26"/>
      <text class="node-title" x="85" y="30" text-anchor="middle">perfX 性能专项</text>
      <text class="node-note" x="85" y="54" text-anchor="middle">采集 · 对比 · 归因</text>
    </g>

    <!-- 第 3 层：语义与感知 -->
    <rect x="72" y="426" width="1170" height="252" fill="#edf2ee" stroke="#1f5b4c" stroke-opacity="0.46"/>
    <path d="M302 426V678" stroke="#1f5b4c" stroke-opacity="0.24"/>
    <text class="layer-num" x="94" y="459">第 3 层</text>
    <text class="layer-title" x="94" y="488">语义与感知</text>
    <text class="layer-note" x="94" y="513">同一业务动作，按场景选择识别能力</text>
    <g transform="translate(328 448)">
      <rect width="870" height="46" rx="2" fill="#fbfaf7" stroke="#1f5b4c" stroke-opacity="0.52"/>
      <text class="mono" x="435" y="29" text-anchor="middle" fill="#1b1b19" font-size="13">统一语义接口 · find · click · exists · input · assert</text>
    </g>
    <text class="node-note" x="328" y="523">能力路由：结构化 UI 优先，OCR / CV 增强，大模型视觉兜底</text>
    <g transform="translate(328 542)">
      <rect width="204" height="108" rx="2" fill="#fbfaf7" stroke="#1b1b19" stroke-opacity="0.28"/>
      <text class="tech" x="18" y="28">结构化</text>
      <path d="M18 38H186" stroke="#1b1b19" stroke-opacity="0.16"/>
      <text class="node-title" x="18" y="62">Poco / UIAutomator2</text>
      <text class="node-note" x="18" y="86">resource-id · text · UI Tree</text>
    </g>
    <g transform="translate(544 542)">
      <rect width="190" height="108" rx="2" fill="#fbfaf7" stroke="#1f5b4c" stroke-opacity="0.42"/>
      <text class="tech mono" x="18" y="28">OCR</text>
      <path d="M18 38H172" stroke="#1b1b19" stroke-opacity="0.16"/>
      <text class="node-title" x="18" y="62">Zeus OCR</text>
      <text class="node-note" x="18" y="86">多语言 · 文本定位 · 坐标</text>
    </g>
    <g transform="translate(746 542)">
      <rect width="206" height="108" rx="2" fill="#fbfaf7" stroke="#1f5b4c" stroke-opacity="0.42"/>
      <text class="tech mono" x="18" y="28">CV</text>
      <path d="M18 38H188" stroke="#1b1b19" stroke-opacity="0.16"/>
      <text class="node-title" x="18" y="62">AirCV · SIFT</text>
      <text class="node-note" x="18" y="86">图标 · Canvas · 视觉特征</text>
    </g>
    <g transform="translate(964 542)">
      <rect width="234" height="108" rx="2" fill="#f4e9e4" stroke="#9a4b2f" stroke-opacity="0.62"/>
      <text class="tech mono warm" x="18" y="28">VLM</text>
      <path d="M18 38H216" stroke="#9a4b2f" stroke-opacity="0.20"/>
      <text class="node-title" x="18" y="62">大模型视觉兜底</text>
      <text class="node-note" x="18" y="86">低置信 · 复杂画面 · 语义判断</text>
    </g>

    <!-- 第 4 层：原生执行 -->
    <rect x="72" y="696" width="1170" height="122" fill="#fbfaf7" stroke="#1b1b19" stroke-opacity="0.18"/>
    <path d="M302 696V818" stroke="#1b1b19" stroke-opacity="0.18"/>
    <text class="layer-num" x="94" y="729">第 4 层</text>
    <text class="layer-title" x="94" y="758">原生执行</text>
    <text class="layer-note" x="94" y="783">识别结果统一转换为设备动作</text>
    <g transform="translate(328 716)">
      <rect width="540" height="82" rx="2" fill="#e8efeb" stroke="#1f5b4c" stroke-opacity="0.68"/>
      <text class="node-title" x="270" y="31" text-anchor="middle">Airtest Core</text>
      <text class="node-note" x="270" y="57" text-anchor="middle">touch · swipe · text · keyevent · app lifecycle · screenshot</text>
    </g>
    <path d="M878 757H925" stroke="#1f5b4c" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(938 716)">
      <rect width="260" height="82" rx="2" fill="#f3f1eb" stroke="#1b1b19" stroke-opacity="0.26"/>
      <text class="node-title" x="130" y="31" text-anchor="middle">设备传输与控制</text>
      <text class="node-note" x="130" y="57" text-anchor="middle">ADB · Remote Device Control</text>
    </g>

    <!-- 第 5 层：真实环境 -->
    <rect x="72" y="836" width="1170" height="114" fill="#fbfaf7" stroke="#1b1b19" stroke-opacity="0.18"/>
    <path d="M302 836V950" stroke="#1b1b19" stroke-opacity="0.18"/>
    <text class="layer-num" x="94" y="869">第 5 层</text>
    <text class="layer-title" x="94" y="898">真实环境</text>
    <text class="layer-note" x="94" y="923">本地与远程设备，统一运行边界</text>
    <g transform="translate(328 856)">
      <rect width="265" height="74" rx="2" fill="#f3f1eb" stroke="#1b1b19" stroke-opacity="0.26"/>
      <text class="node-title" x="132.5" y="29" text-anchor="middle">Android 真机池</text>
      <text class="node-note" x="132.5" y="52" text-anchor="middle">本地 · 远程 · 独占租约</text>
    </g>
    <g transform="translate(608 856)">
      <rect width="265" height="74" rx="2" fill="#f3f1eb" stroke="#1b1b19" stroke-opacity="0.26"/>
      <text class="node-title" x="132.5" y="29" text-anchor="middle">多技术界面</text>
      <text class="node-note" x="132.5" y="52" text-anchor="middle">Native · WebView · Unity · 游戏</text>
    </g>
    <g transform="translate(888 856)">
      <rect width="310" height="74" rx="2" fill="#f3f1eb" stroke="#1b1b19" stroke-opacity="0.26"/>
      <text class="node-title" x="155" y="29" text-anchor="middle">多状态稳定帧</text>
      <text class="node-note" x="155" y="52" text-anchor="middle">等待就绪 · 动作后确认 · 异常现场</text>
    </g>

    <!-- 层间流向 -->
    <path d="M758 262V278" stroke="#1f5b4c" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M758 408V424" stroke="#1f5b4c" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M758 678V694" stroke="#1f5b4c" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M758 818V834" stroke="#1f5b4c" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 证据链 -->
    <rect x="1270" y="150" width="258" height="800" fill="#eeeae0" stroke="#9a4b2f" stroke-opacity="0.56"/>
    <text class="rail-title" x="1300" y="188">证据链</text>
    <text class="layer-title" x="1300" y="220">证据记录与回传</text>
    <path d="M1312 256V854" stroke="#9a4b2f" stroke-opacity="0.48" stroke-width="2"/>
    <g>
      <circle cx="1312" cy="292" r="7" fill="#9a4b2f"/>
      <text class="rail-item" x="1338" y="288">运行边界</text>
      <text class="rail-note" x="1338" y="311">租约 · 心跳 · 账号前置</text>
    </g>
    <g transform="translate(0 136)">
      <circle cx="1312" cy="292" r="7" fill="#1f5b4c"/>
      <text class="rail-item" x="1338" y="288">现场证据</text>
      <text class="rail-note" x="1338" y="311">截图 · 录屏 · 动作轨迹</text>
    </g>
    <g transform="translate(0 272)">
      <circle cx="1312" cy="292" r="7" fill="#9a4b2f"/>
      <text class="rail-item" x="1338" y="288">结果判断</text>
      <text class="rail-note" x="1338" y="311">断言 · 通过 · 失败 · 阻断</text>
    </g>
    <g transform="translate(0 408)">
      <circle cx="1312" cy="292" r="7" fill="#1f5b4c"/>
      <text class="rail-item" x="1338" y="288">协作回写</text>
      <text class="rail-note" x="1338" y="311">状态 · 报告 · 附件索引</text>
    </g>
    <g transform="translate(0 544)">
      <circle cx="1312" cy="292" r="7" fill="#9a4b2f"/>
      <text class="rail-item" x="1338" y="288">用于调整</text>
      <text class="rail-note" x="1338" y="311">规则 · Selector · Case 资产</text>
    </g>
    <path d="M1312 880C1262 880 1257 550 1224 550" fill="none" stroke="#9a4b2f" stroke-opacity="0.62" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1399" y="910" text-anchor="middle" fill="#9a4b2f" font-size="11" font-weight="700">失败证据回到规则与用例</text>

    <path d="M72 978H1528" stroke="#1b1b19" stroke-opacity="0.42"/>
    <text x="72" y="1010" fill="#66655f" font-size="11">公开架构图 · 内部地址、账号与设备标识已脱敏</text>
    <text x="1528" y="1010" text-anchor="end" fill="#66655f" font-size="11">张晨 / 研发自动化</text>
  </g>
</svg>
