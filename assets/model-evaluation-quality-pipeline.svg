<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">大模型效果评估：多模型对照与业务场景验证</title>
  <desc id="desc">展示真实业务样本和版本化评测集进入多模型横向对比、Union 生成及 Mochi、Cuddmi、Yovela 三类业务适配器，经确定性规则、产品 Judge 与独立 Shadow Judge 校准，比较不同模型的候选胜率、Judge 覆盖率、延迟、成本、任务状态和证据结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#1d5fc4"/>
    </marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#6f839b"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .page-title { fill: #17243a; font-size: 40px; font-weight: 700; letter-spacing: -1px; }
      .subtitle { fill: #5a687b; font-size: 17px; }
      .lane-kicker { fill: #1d5fc4; font-size: 10px; font-weight: 700; letter-spacing: .65px; }
      .lane-title { fill: #17243a; font-size: 22px; font-weight: 700; }
      .stage { fill: #1d5fc4; font-size: 10px; font-weight: 700; letter-spacing: .55px; }
      .card-title { fill: #17243a; font-size: 16px; font-weight: 700; }
      .card-title-sm { fill: #17243a; font-size: 13px; font-weight: 700; }
      .card-note { fill: #5a687b; font-size: 11px; }
      .card-note-sm { fill: #5a687b; font-size: 10px; }
      .code { fill: #245ca6; font-size: 9px; font-weight: 700; letter-spacing: .25px; }
      .metric { fill: #17243a; font-size: 23px; font-weight: 700; }
      .metric-note { fill: #5a687b; font-size: 10px; }
      .flow { fill: none; stroke: #1d5fc4; stroke-width: 1.8; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #6f839b; stroke-width: 1.55; stroke-dasharray: 6 5; marker-end: url(#arrow-muted); }
      .divider { stroke: #17243a; stroke-opacity: .13; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#edf5ff"/>
  <g class="sans">
    <text class="page-title" x="72" y="70">大模型效果评估：多模型对照与业务场景验证</text>
    <text class="subtitle" x="72" y="106">真实业务样本 · 多模型横向对比 · Baseline / Candidate · Rules + Judge · Cost / Latency</text>
    <g transform="translate(1110 48)">
      <rect width="418" height="46" rx="2" fill="#ffffff" stroke="#17243a" stroke-opacity=".42"/>
      <rect width="7" height="46" fill="#1d5fc4"/>
      <text class="mono" x="24" y="29" fill="#17243a" font-size="11">MODEL EVAL · MODEL COMPARISON · REGRESSION</text>
    </g>
    <path d="M72 130H1528" stroke="#17243a" stroke-opacity=".42"/>

    <!-- Lane headers -->
    <g transform="translate(72 154)">
      <rect width="270" height="64" fill="#e8f1ff" stroke="#1d5fc4" stroke-opacity=".42"/>
      <rect width="7" height="64" fill="#1d5fc4"/>
      <text class="lane-kicker mono" x="22" y="22">01 · EVALUATION ASSETS</text>
      <text class="lane-title" x="22" y="48">评测输入与契约</text>
    </g>
    <g transform="translate(366 154)">
      <rect width="454" height="64" fill="#dcecff" stroke="#1d5fc4" stroke-opacity=".58"/>
      <rect width="7" height="64" fill="#1d5fc4"/>
      <text class="lane-kicker mono" x="22" y="22">02 · MODEL EXECUTION</text>
      <text class="lane-title" x="22" y="48">多模型选型与业务适配</text>
    </g>
    <g transform="translate(844 154)">
      <rect width="300" height="64" fill="#e8f1ff" stroke="#1d5fc4" stroke-opacity=".42"/>
      <rect width="7" height="64" fill="#1d5fc4"/>
      <text class="lane-kicker mono" x="22" y="22">03 · HYBRID JUDGING</text>
      <text class="lane-title" x="22" y="48">规则与独立复核</text>
    </g>
    <g transform="translate(1168 154)">
      <rect width="360" height="64" fill="#dcecff" stroke="#1d5fc4" stroke-opacity=".58"/>
      <rect width="7" height="64" fill="#1d5fc4"/>
      <text class="lane-kicker mono" x="22" y="22">04 · METRICS &amp; GATE</text>
      <text class="lane-title" x="22" y="48">指标、门禁与证据</text>
    </g>

    <!-- Lane 01 -->
    <g transform="translate(72 236)">
      <rect width="270" height="494" fill="#ffffff" stroke="#17243a" stroke-opacity=".18"/>
      <g transform="translate(18 18)">
        <rect width="234" height="118" fill="#e8f1ff" stroke="#1d5fc4" stroke-opacity=".46"/>
        <text class="stage mono" x="16" y="22">REAL BUSINESS SAMPLE</text>
        <text class="card-title" x="16" y="49">真实业务需求样本</text>
        <text class="card-note" x="16" y="72">7 个需求 · 活动 / App / 小游戏</text>
        <text class="card-note" x="16" y="94">以真实交付任务替代演示 Prompt</text>
      </g>
      <g transform="translate(18 150)">
        <rect width="234" height="132" fill="#ffffff" stroke="#17243a" stroke-opacity=".22"/>
        <text class="stage mono" x="16" y="22">VERSIONED DATASET</text>
        <text class="card-title" x="16" y="49">版本化评测集</text>
        <text class="card-note" x="16" y="72">Schema · Version · SHA-256</text>
        <text class="card-note" x="16" y="94">Expected · Tags · Difficulty</text>
        <text class="code mono" x="16" y="116">dataset_key · checksum</text>
      </g>
      <g transform="translate(18 296)">
        <rect width="234" height="180" fill="#ffffff" stroke="#17243a" stroke-opacity=".22"/>
        <text class="stage mono" x="16" y="22">RUN CONTRACT</text>
        <text class="card-title" x="16" y="49">统一运行契约</text>
        <path class="divider" d="M16 62H218"/>
        <text class="card-note" x="16" y="86">Baseline / Candidate</text>
        <text class="card-note" x="16" y="108">Case Status · Winner</text>
        <text class="card-note" x="16" y="130">Evidence Ref · Run Type</text>
        <text class="card-note" x="16" y="152">敏感字段扫描与摘要归档</text>
      </g>
    </g>

    <!-- Lane 02 -->
    <path class="flow" d="M342 483H378"/>
    <g transform="translate(366 236)">
      <rect width="454" height="494" fill="#ffffff" stroke="#17243a" stroke-opacity=".18"/>
      <g transform="translate(18 18)">
        <rect width="418" height="132" fill="#e8f1ff" stroke="#1d5fc4" stroke-opacity=".48"/>
        <text class="stage mono" x="16" y="22">MODEL SELECTION MATRIX</text>
        <text class="card-title" x="16" y="47">横向模型选型</text>
        <g transform="translate(16 62)">
          <rect width="58" height="23" fill="#ffffff" stroke="#1d5fc4" stroke-opacity=".34"/>
          <text class="card-note-sm" x="29" y="15" text-anchor="middle">Haiku</text>
          <rect x="64" width="62" height="23" fill="#ffffff" stroke="#1d5fc4" stroke-opacity=".34"/>
          <text class="card-note-sm" x="95" y="15" text-anchor="middle">Sonnet</text>
          <rect x="132" width="58" height="23" fill="#ffffff" stroke="#1d5fc4" stroke-opacity=".34"/>
          <text class="card-note-sm" x="161" y="15" text-anchor="middle">Opus</text>
          <rect x="196" width="64" height="23" fill="#ffffff" stroke="#1d5fc4" stroke-opacity=".34"/>
          <text class="card-note-sm" x="228" y="15" text-anchor="middle">GPT-5.4</text>
          <rect x="266" width="64" height="23" fill="#ffffff" stroke="#1d5fc4" stroke-opacity=".34"/>
          <text class="card-note-sm" x="298" y="15" text-anchor="middle">GPT-5.5</text>
          <rect x="336" width="64" height="23" fill="#ffffff" stroke="#1d5fc4" stroke-opacity=".34"/>
          <text class="card-note-sm" x="368" y="15" text-anchor="middle">DeepSeek</text>
        </g>
        <text class="card-note" x="16" y="108">样本结论：GPT-5.4 表现较好</text>
      </g>
      <g transform="translate(18 164)">
        <rect width="418" height="86" fill="#dcecff" stroke="#1d5fc4" stroke-opacity=".62"/>
        <text class="stage mono" x="16" y="21">UNION MODE</text>
        <text class="card-title" x="16" y="46">多模型并行生成与结果合并</text>
        <text class="card-note" x="16" y="68">质量与数量均有改善 · 暂不公开量化提升比例</text>
      </g>
      <g transform="translate(18 264)">
        <rect width="418" height="212" fill="#ffffff" stroke="#17243a" stroke-opacity=".22"/>
        <text class="stage mono" x="16" y="22">PRODUCT ADAPTERS</text>
        <g transform="translate(16 38)">
          <rect width="386" height="46" fill="#e8f1ff" stroke="#1d5fc4" stroke-opacity=".42"/>
          <text class="card-title-sm" x="14" y="20">Mochi · 对话质量 A/B</text>
          <text class="card-note-sm" x="14" y="36">规则问题数 · 延迟 · 记忆命中</text>
          <rect y="56" width="386" height="46" fill="#e8f1ff" stroke="#1d5fc4" stroke-opacity=".42"/>
          <text class="card-title-sm" x="14" y="76">Cuddmi · 记忆离线回放</text>
          <text class="card-note-sm" x="14" y="92">Baseline / Candidate · Multi-Judge</text>
          <rect y="112" width="386" height="46" fill="#e8f1ff" stroke="#1d5fc4" stroke-opacity=".42"/>
          <text class="card-title-sm" x="14" y="132">Yovela · 叙事生成评测</text>
          <text class="card-note-sm" x="14" y="148">Candidate-only · 双端点 A/B</text>
        </g>
      </g>
    </g>

    <!-- Lane 03 -->
    <path class="flow" d="M820 483H856"/>
    <g transform="translate(844 236)">
      <rect width="300" height="494" fill="#ffffff" stroke="#17243a" stroke-opacity=".18"/>
      <g transform="translate(18 18)">
        <rect width="264" height="146" fill="#e8f1ff" stroke="#1d5fc4" stroke-opacity=".46"/>
        <text class="stage mono" x="16" y="22">DETERMINISTIC RULES</text>
        <text class="card-title" x="16" y="49">确定性规则先兜底</text>
        <text class="card-note" x="16" y="74">信息泄漏 · 空输出</text>
        <text class="card-note" x="16" y="96">语言漂移 · 可能截断</text>
        <text class="card-note" x="16" y="118">结构异常 · Turn 失败</text>
      </g>
      <g transform="translate(18 178)">
        <rect width="264" height="128" fill="#ffffff" stroke="#17243a" stroke-opacity=".22"/>
        <text class="stage mono" x="16" y="22">PRODUCT JUDGE</text>
        <text class="card-title" x="16" y="49">业务维度评分</text>
        <text class="card-note" x="16" y="74">事实召回 · 具体性 · 连续性</text>
        <text class="card-note" x="16" y="96">幻觉防护 · 人设一致 · 自然度</text>
      </g>
      <g transform="translate(18 320)">
        <rect width="264" height="156" fill="#ffffff" stroke="#6f839b" stroke-opacity=".5" stroke-dasharray="6 5"/>
        <text class="stage mono" x="16" y="22">SHADOW JUDGE</text>
        <text class="card-title" x="16" y="49">OpenRouter 独立影子复核</text>
        <text class="card-note" x="16" y="74">只读取 Case 与截断输出摘要</text>
        <text class="card-note" x="16" y="96">独立记录意见与覆盖率</text>
        <path class="divider" d="M16 112H248"/>
        <text class="code mono" x="16" y="135">NO WINNER / GATE MUTATION</text>
      </g>
    </g>

    <!-- Lane 04 -->
    <path class="flow" d="M1144 483H1180"/>
    <g transform="translate(1168 236)">
      <rect width="360" height="494" fill="#ffffff" stroke="#17243a" stroke-opacity=".18"/>
      <g transform="translate(18 18)">
        <rect width="324" height="184" fill="#e8f1ff" stroke="#1d5fc4" stroke-opacity=".46"/>
        <text class="stage mono" x="16" y="22">METRIC AGGREGATION</text>
        <text class="card-title" x="16" y="49">质量、效率与覆盖共同判定</text>
        <g transform="translate(16 66)">
          <text class="card-note" x="0" y="16">Candidate Win Rate</text>
          <text class="card-note" x="164" y="16">Judge Coverage</text>
          <text class="card-note" x="0" y="43">P95 Latency</text>
          <text class="card-note" x="164" y="43">Average Cost</text>
          <text class="card-note" x="0" y="70">Blocked Cases</text>
          <text class="card-note" x="164" y="70">Zero-tolerance</text>
        </g>
        <text class="code mono" x="16" y="161">evaluate_gate(bundle)</text>
      </g>
      <g transform="translate(18 216)">
        <rect width="324" height="112" fill="#dcecff" stroke="#1d5fc4" stroke-opacity=".62"/>
        <text class="stage mono" x="16" y="22">GATE RESULT</text>
        <g transform="translate(16 40)">
          <rect width="64" height="28" fill="#ffffff" stroke="#1d5fc4" stroke-opacity=".55"/>
          <text class="card-title-sm" x="32" y="19" text-anchor="middle">PASS</text>
          <rect x="72" width="64" height="28" fill="#ffffff" stroke="#1d5fc4" stroke-opacity=".55"/>
          <text class="card-title-sm" x="104" y="19" text-anchor="middle">FAIL</text>
          <rect x="144" width="78" height="28" fill="#ffffff" stroke="#1d5fc4" stroke-opacity=".55"/>
          <text class="card-title-sm" x="183" y="19" text-anchor="middle">BLOCKED</text>
          <rect x="230" width="62" height="28" fill="#ffffff" stroke="#1d5fc4" stroke-opacity=".55"/>
          <text class="card-title-sm" x="261" y="19" text-anchor="middle">N/A</text>
        </g>
        <text class="card-note-sm" x="16" y="93">质量失败与环境阻断分开记录</text>
      </g>
      <g transform="translate(18 342)">
        <rect width="324" height="134" fill="#ffffff" stroke="#17243a" stroke-opacity=".22"/>
        <text class="stage mono" x="16" y="22">IMMUTABLE EVIDENCE</text>
        <text class="card-title" x="16" y="49">证据归档与历史回归</text>
        <text class="card-note" x="16" y="74">逐 Case 结果 · Evidence Ref</text>
        <text class="card-note" x="16" y="96">失败 / 阻断 / 超时现场保留</text>
        <text class="code mono" x="16" y="117">archive · replay · compare</text>
      </g>
    </g>

    <!-- Feedback loop -->
    <path class="feedback" d="M1350 730C1350 758 1320 770 1284 770H225C176 770 154 750 154 724"/>
    <text class="card-note-sm" x="800" y="765" text-anchor="middle">验证结果回流评测集、规则、路由与下一版本回归</text>

    <!-- Proven results -->
    <g transform="translate(72 788)">
      <rect width="1456" height="154" fill="#ffffff" stroke="#17243a" stroke-opacity=".18"/>
      <rect width="7" height="154" fill="#1d5fc4"/>
      <text class="stage mono" x="24" y="28">VERIFIED OUTCOMES</text>
      <text class="card-title" x="24" y="55">工程验收、业务观察与校准结果分开计数</text>
      <path d="M330 22V132" stroke="#17243a" stroke-opacity=".14"/>
      <g transform="translate(366 40)">
        <text class="metric" x="0" y="25">7 需求 · 6 模型</text>
        <text class="metric-note" x="0" y="48">真实业务横评</text>
        <text class="metric-note" x="0" y="66">GPT-5.4 样本表现较好 · Union 改善</text>
      </g>
      <path d="M666 22V132" stroke="#17243a" stroke-opacity=".14"/>
      <g transform="translate(702 40)">
        <text class="metric" x="0" y="25">3 类业务适配</text>
        <text class="metric-note" x="0" y="48">对话 A/B · 记忆回放 · 叙事 A/B</text>
      </g>
      <path d="M962 22V132" stroke="#17243a" stroke-opacity=".14"/>
      <g transform="translate(998 40)">
        <text class="metric" x="0" y="25">3/3 · 135 QA tests</text>
        <text class="metric-note" x="0" y="48">Yovela 接入工程验收</text>
        <text class="metric-note" x="0" y="66">不等同于线上质量提升</text>
      </g>
      <path d="M1230 22V132" stroke="#17243a" stroke-opacity=".14"/>
      <g transform="translate(1266 40)">
        <text class="metric" x="0" y="25">473 真机校准</text>
        <text class="metric-note" x="0" y="48">426 高 · 38 中 · 2 人工</text>
        <text class="metric-note" x="0" y="66">多模态方法复用</text>
      </g>
    </g>

    <path d="M72 970H1528" stroke="#17243a" stroke-opacity=".30"/>
    <text class="card-note" x="72" y="998">公开口径：473 条为多模态视觉校准，不计入 LLM Benchmark；Shadow Judge 只提供独立意见，不改变正式 Winner 与 Gate。</text>
    <text class="card-note" x="1528" y="998" text-anchor="end">张晨 / AI 质量工程与模型评测</text>
  </g>
</svg>
